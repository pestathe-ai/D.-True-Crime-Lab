name: d_true_crime_lab
description: "D. True Crime Lab – misteri che vivono dentro il tuo telefono."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/photos/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#111114"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 24
  remove_alpha_ios: true

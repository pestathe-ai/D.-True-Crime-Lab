name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup platforms
        run: |
          chmod +x tool/setup_platforms.sh
          set -o pipefail
          if ! ./tool/setup_platforms.sh 2>&1 | tee x.log; then
            grep -n -i -E 'error|what went wrong|failed|exception' x.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=setup::$(cat err.txt)"
            exit 1
          fi

      - name: Analyze
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee x.log; then
            grep -n -E 'error •|\.dart:[0-9]+:[0-9]+' x.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=analyze::$(cat err.txt)"
            exit 1
          fi

      - name: Test
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee x.log; then
            grep -n -i -E 'error|failed|exception|Expected|Actual|Which|\.dart [0-9]+:[0-9]+|\.dart:[0-9]+' x.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=test::$(cat err.txt)"
            exit 1
          fi

      - name: Build APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --split-per-abi 2>&1 | tee x.log; then
            grep -n -i -E 'error|what went wrong|failed|exception|\.dart:[0-9]+' x.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=build::$(cat err.txt)"
            exit 1
          fi

      - name: Sign APKs
        run: |
          set -o pipefail
          PW=$(openssl rand -hex 16)
          keytool -genkeypair -keystore /tmp/app.jks -alias app -keyalg RSA \
            -keysize 2048 -validity 10000 -dname "CN=D. True Crime Lab, C=IT" \
            -storepass "$PW" -keypass "$PW" >/dev/null
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            if ! "${BT}apksigner" sign --ks /tmp/app.jks --ks-key-alias app \
                 --ks-pass "pass:$PW" --key-pass "pass:$PW" "$f" 2>&1 | tee x.log; then
              echo "::error title=sign::$(tail -5 x.log | tr '\n' ' ')"
              exit 1
            fi
            "${BT}apksigner" verify "$f"
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: D. True Crime Lab – build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*-release.apk
          body: |
            Scarica **app-arm64-v8a-release.apk** (quasi tutti i telefoni recenti).
            Telefoni molto vecchi: app-armeabi-v7a-release.apk.
